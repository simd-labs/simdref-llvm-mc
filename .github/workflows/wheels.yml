name: wheels

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      publish_existing:
        description: Publish the musllinux wheels to the already released version
        type: boolean
        default: false

jobs:
  wheels:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux-x86_64
            os: ubuntu-24.04
            arch: x86_64
            build: cp312-manylinux_x86_64
          - label: linux-aarch64
            os: ubuntu-24.04-arm
            arch: aarch64
            build: cp312-manylinux_aarch64
          - label: linux-musllinux-x86_64
            os: ubuntu-24.04
            arch: x86_64
            build: cp312-musllinux_x86_64
          - label: linux-musllinux-aarch64
            os: ubuntu-24.04-arm
            arch: aarch64
            build: cp312-musllinux_aarch64
          - label: macos-arm64
            os: macos-14
            arch: arm64
            build: cp312-macosx_arm64
          - label: macos-x86_64
            os: macos-14
            arch: x86_64
            build: cp312-macosx_x86_64
          - label: windows-amd64
            os: windows-latest
            arch: AMD64
            build: cp312-win_amd64
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up the MSVC environment
        if: matrix.label == 'windows-amd64'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Diagnose the Windows toolchain
        if: matrix.label == 'windows-amd64'
        shell: bash
        run: |
          cmake --version | head -n1 || true
          ninja --version || true
          which -a ninja || true
          where cl || true
          python -c "import ninja; print('pip ninja:', ninja.__version__, ninja.BIN_DIR)" || true

      - name: Cache the LLVM source tarball
        id: cache-llvm
        uses: actions/cache@v4
        with:
          path: .llvm-src
          key: llvm-src-${{ hashFiles('llvm-version.txt') }}

      - name: Download the LLVM source tarball
        if: steps.cache-llvm.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euxo pipefail
          tag="$(head -n1 llvm-version.txt)"
          ver="${tag#llvmorg-}"
          mkdir -p .llvm-src
          curl -fL --retry 3 -o .llvm-src/llvm-project.src.tar.xz \
            "https://github.com/llvm/llvm-project/releases/download/${tag}/llvm-project-${ver}.src.tar.xz"

      - name: Install cibuildwheel
        run: python -m pip install cibuildwheel

      - name: Build the wheel
        run: python -m cibuildwheel --output-dir wheelhouse
        env:
          CIBW_ARCHS_LINUX: ${{ matrix.arch }}
          CIBW_ARCHS_MACOS: ${{ matrix.arch }}
          CIBW_ARCHS_WINDOWS: ${{ matrix.arch }}
          CIBW_BUILD: ${{ matrix.build }}

      - name: Upload the wheel
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.label }}
          path: wheelhouse/*.whl

  publish:
    needs: wheels
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Check the tag matches the package version
        shell: bash
        run: |
          set -euo pipefail
          pkg_version="$(grep -m1 '^version = ' pyproject.toml | cut -d'"' -f2)"
          if [ "${GITHUB_REF_NAME#v}" != "$pkg_version" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match pyproject version $pkg_version"
            exit 1
          fi

      - name: Download the wheels
        uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true

      - run: ls -la dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  publish-musllinux:
    needs: wheels
    if: github.event_name == 'workflow_dispatch' && inputs.publish_existing
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check the version is a released tag on this ref's history
        shell: bash
        run: |
          set -euo pipefail
          pkg_version="$(grep -m1 '^version = ' pyproject.toml | cut -d'"' -f2)"
          # The wheel can only join an existing release: the version must be a
          # tag in this ref's history.
          if [ "$(git describe --tags --match "v${pkg_version}" --abbrev=0 2>/dev/null || true)" != "v${pkg_version}" ]; then
            echo "version $pkg_version has no tag v${pkg_version} in this ref's history"
            exit 1
          fi

      - name: Download the musllinux wheels
        uses: actions/download-artifact@v4
        with:
          pattern: wheels-linux-musllinux-*
          path: dist
          merge-multiple: true

      - run: ls -la dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
