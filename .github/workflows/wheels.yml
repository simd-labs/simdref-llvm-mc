name: wheels

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  wheels:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux-x86_64
            os: ubuntu-24.04
            arch: x86_64
          - label: linux-aarch64
            os: ubuntu-24.04-arm
            arch: aarch64
          - label: macos-arm64
            os: macos-14
            arch: arm64
          - label: macos-x86_64
            os: macos-14
            arch: x86_64
          - label: windows-amd64
            os: windows-latest
            arch: AMD64
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Cache the LLVM source tarball
        id: cache-llvm
        uses: actions/cache@v4
        with:
          path: .llvm-src
          key: llvm-src-${{ hashFiles('llvm-version.txt') }}

      - name: Download the LLVM source tarball
        if: steps.cache-llvm.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euxo pipefail
          tag="$(head -n1 llvm-version.txt)"
          ver="${tag#llvmorg-}"
          mkdir -p .llvm-src
          curl -fL --retry 3 -o .llvm-src/llvm-project.src.tar.xz \
            "https://github.com/llvm/llvm-project/releases/download/${tag}/llvm-project-${ver}.src.tar.xz"

      - name: Install cibuildwheel
        run: python -m pip install cibuildwheel

      - name: Build the wheel
        run: python -m cibuildwheel --output-dir wheelhouse
        env:
          CIBW_ARCHS_LINUX: ${{ matrix.arch }}
          CIBW_ARCHS_MACOS: ${{ matrix.arch }}
          CIBW_ARCHS_WINDOWS: ${{ matrix.arch }}

      - name: Upload the wheel
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.label }}
          path: wheelhouse/*.whl
